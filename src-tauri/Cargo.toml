[package]
name = "crochat"
version = "0.1.0"
description = "CrocHat — widget de escritorio Pomodoro pixel-art"
authors = ["vhhatziry"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix avoids a name collision with the `crochat` binary on Windows.
[lib]
name = "crochat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optimize the release binary for size (portable .exe).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
